# A QUIET GAZE — nginx site for the static export
#
# 安装：
#   1. 把 root 改成实际目录（与 deploy.mjs 的 --path 一致）
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/saul-leiter
#   3. sudo ln -s /etc/nginx/sites-available/saul-leiter /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# 站点是 next build 的 output: "export" 产物，没有 Node 进程，
# 所以只需要静态文件服务；trailingSlash 为 true，每页都是 <path>/index.html。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/saul-leiter;
    index index.html;

    charset utf-8;
    server_tokens off;
    # 让 /work/taxi → /work/taxi/ 的跳转保持相对路径，换 IP / 域名都不用改配置
    absolute_redirect off;

    # 后台定时重渲染时，旧文件名不会立刻消失，慢一点也能拿到资源
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # /work/ → /work/index.html，/work/taxi/ → /work/taxi/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # 只允许 nginx 内部跳转到 404 页面
    location = /404.html {
        internal;
    }

    # export 会同时生成 /404/index.html，直接访问时仍应返回 404 状态
    location ^~ /404/ {
        return 404;
    }

    # 带内容哈希的构建产物，可以长期缓存
    location ^~ /_next/static/ {
        expires 1y;
        access_log off;
    }

    # 照片与图片变体（含 responsive-images.mjs 生成的 -480/-960/-1600）
    location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # HTML 每次回源校验，部署后立刻生效
    location ~* \.html$ {
        expires -1;
    }

    # 隐藏文件（.git 等）不对外
    location ~ /\.(?!well-known) {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
